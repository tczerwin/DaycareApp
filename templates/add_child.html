{% extends 'base.html' %}

{% block head %}
<title>Add Child</title>
{% endblock %}

{% block body %}
<div class="content">
	<h1 style="text-align: center">Add New Child</h1>

	<form action="/add-child" method='POST' enctype="multipart/form-data" style="display: flex; flex-direction: column; gap: 20px; max-width: 500px; margin: 0 auto;">
		<div>
			<label for="name" style="display: block; margin-bottom: 8px; font-weight: bold;">Child Name:</label>
			<input type="text" name="name" id="name" placeholder="Enter child's name" required style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px;">
		</div>

		<div>
			<label for="parent_name" style="display: block; margin-bottom: 8px; font-weight: bold;">Parent Name:</label>
			<input type="text" name="parent_name" id="parent_name" placeholder="Enter parent's name" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px;">
		</div>

		<div>
			<label for="parent_phone" style="display: block; margin-bottom: 8px; font-weight: bold;">Parent Phone:</label>
			<input type="tel" name="parent_phone" id="parent_phone" placeholder="Enter parent's phone number" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px;">
		</div>

		<div>
			<label for="picture" style="display: block; margin-bottom: 8px; font-weight: bold;">Picture:</label>
			<input type="file" name="picture" id="picture" accept="image/*" style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px;">
			<small style="color: #666; display: block; margin-top: 5px;">Optional - if not uploaded, will use baby.png</small>
		</div>

		<div>
			<label for="notes" style="display: block; margin-bottom: 8px; font-weight: bold;">Notes:</label>
			<textarea name="notes" id="notes" placeholder="Allergies, medications, special instructions..." style="width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 5px; font-size: 16px; resize: vertical; min-height: 100px;"></textarea>
			<small style="color: #666; display: block; margin-top: 5px;">Optional - add any important information</small>
		</div>

		<div style="display: flex; gap: 10px;">
			<input type="submit" value="Add Child" style="flex: 1; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer;">
			<a href="/" style="flex: 1; padding: 12px; background-color: #f0f0f0; color: #333; text-decoration: none; border-radius: 5px; text-align: center; font-weight: bold; border: 2px solid #ddd;">Cancel</a>
		</div>
	</form>
</div>

{% endblock %}
